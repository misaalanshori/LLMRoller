name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  governance:
    name: governance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Documentation consistency and traceability
        run: |
          cargo xtask doc-consistency
          cargo xtask docs-bundle --check
          cargo xtask traceability --milestone M6

      - name: Supply-chain policy
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check bans licenses advisories sources

      - name: Validate Compose manifest
        run: docker compose config --quiet

  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            run_tests: true
            packages: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            run_tests: false
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            run_tests: false
            packages: gcc-aarch64-linux-gnu
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            run_tests: false
            packages: gcc-aarch64-linux-gnu musl-tools
          - target: aarch64-apple-darwin
            os: macos-14
            run_tests: true
            packages: ""
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Linux cross toolchain packages
        if: runner.os == 'Linux' && matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Install cross toolchain
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-musl')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      - name: Compile and run unit tests
        if: matrix.run_tests
        run: cargo test --workspace --all-targets --target ${{ matrix.target }}

      - name: Cross-check all targets
        if: ${{ !matrix.run_tests }}
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  container:
    name: container (${{ matrix.stage }})
    runs-on: ubuntu-24.04
    needs: [governance, test]
    strategy:
      fail-fast: false
      matrix:
        stage: [runtime-distroless, runtime-dev]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build ${{ matrix.stage }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.stage }}
          tags: llmroller:ci-${{ matrix.stage }}
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.stage }}
          cache-to: type=gha,mode=max,scope=${{ matrix.stage }}

      - name: Verify production image contract
        if: matrix.stage == 'runtime-distroless'
        run: |
          test "$(docker image inspect llmroller:ci-runtime-distroless --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect llmroller:ci-runtime-distroless --format '{{join .Config.Entrypoint " "}}')" = "/usr/local/bin/llmroller"
        continue-on-error: false
