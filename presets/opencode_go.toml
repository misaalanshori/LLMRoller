# OpenCode Go provider preset.
# Spec: ./docs/srdd/2. SRDD - Research Findings.md#23-target-provider-endpoints-protocols-and-quotas

kind = "opencode_go"
name = "OpenCode Go"
base_url = "https://opencode.ai/zen/go/v1"
ua_policy = "profile"
ua_profile = "opencode_go"

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"
usage = "/usage"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-opencode-client" = "app"

[session_profile]
headers = ["x-opencode-session"]

[model_protocols]
"glm-5" = ["chat"]
"glm-5.1" = ["chat"]
"kimi-k2.5" = ["chat"]
"qwen3.5-plus" = ["chat"]
"qwen3.6-plus" = ["chat"]
"minimax-m2.5" = ["messages"]
"minimax-m2.7" = ["messages"]
"gpt-5.4" = ["responses"]
"gpt-6-luna" = ["responses"]
"muse-spark-20260408" = ["responses"]
"muse-spark-thinking-20260408" = ["responses"]
"grok-4.7" = ["responses"]

[aliases]
"claude-sonnet-4-6" = "claude-sonnet-4.6"
"glm-5" = "glm-5"
"glm-5-1" = "glm-5.1"
"kimi-k2-5" = "kimi-k2.5"
"minimax-m2-5" = "minimax-m2.5"
"minimax-m2-7" = "minimax-m2.7"
"qwen3-5-plus" = "qwen3.5-plus"
"qwen3-6-plus" = "qwen3.6-plus"
"gpt-5-4" = "gpt-5.4"
"gpt-6-luna" = "gpt-6-luna"
"muse-spark-20260408" = "muse-spark-20260408"
"muse-spark-thinking-20260408" = "muse-spark-thinking-20260408"
"grok-4-7" = "grok-4.7"
