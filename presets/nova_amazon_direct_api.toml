# Amazon Nova Direct API (`api.nova.amazon.com/v1`) provider preset (F167).
# Spec: apiclientreferences/opencode/nova.md

kind = "custom"
preset_id = "nova_amazon_direct_api"
name = "Amazon Nova Direct API (`api.nova.amazon.com/v1`)"
base_url = "https://api.nova.amazon.com/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"nova-2-pro-v1" = "nova-2-pro-v1"
"nova-2-lite-v1" = "nova-2-lite-v1"
"nova-premier-v1" = "nova-premier-v1"
"nova-pro-v1" = "nova-pro-v1"
