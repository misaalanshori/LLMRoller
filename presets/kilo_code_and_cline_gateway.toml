# Kilo Code (`api.kilo.ai/api/gateway`) & Cline Gateway (`api.cline.bot/api/v1`) provider preset (F158).
# Spec: apiclientreferences/opencode/kilo.md, apiclientreferences/9router/cline.md

kind = "custom"
preset_id = "kilo_code_and_cline_gateway"
name = "Kilo Code (`api.kilo.ai/api/gateway`) & Cline Gateway (`api.cline.bot/api/v1`)"
base_url = "https://api.kilo.ai/api/gateway"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "kilo_code_and_cline_gateway"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"anthropic/claude-opus-4-6" = "anthropic/claude-opus-4.6"
"anthropic/claude-sonnet-4-6" = "anthropic/claude-sonnet-4.6"
"openai/gpt-5-4" = "openai/gpt-5.4"
"kilo-auto/frontier" = "kilo-auto/frontier"
