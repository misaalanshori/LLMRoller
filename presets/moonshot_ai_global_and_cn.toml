# Moonshot AI (`api.moonshot.ai/v1` Global & `api.moonshot.cn/v1` CN) provider preset (F139).
# Spec: apiclientreferences/opencode/moonshotai.md, apiclientreferences/9router/kimi.md

kind = "custom"
preset_id = "moonshot_ai_global_and_cn"
name = "Moonshot AI (`api.moonshot.ai/v1` Global & `api.moonshot.cn/v1` CN)"
base_url = "https://api.moonshot.ai/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "moonshot_ai_global_and_cn"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"kimi-k2-5" = "kimi-k2.5"
"kimi-k2-thinking" = "kimi-k2-thinking"
"kimi-k2-thinking-turbo" = "kimi-k2-thinking-turbo"
"kimi-k2-0905-preview" = "kimi-k2-0905-preview"
