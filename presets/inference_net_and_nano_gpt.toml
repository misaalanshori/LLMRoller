# NanoGPT (`nano-gpt.com/api/v1`) & Inference.net (`api.inference.net/v1`) provider preset (F144).
# Spec: apiclientreferences/opencode/nano-gpt.md, apiclientreferences/opencode/inference.md

kind = "custom"
preset_id = "inference_net_and_nano_gpt"
name = "NanoGPT (`nano-gpt.com/api/v1`) & Inference.net (`api.inference.net/v1`)"
base_url = "https://nano-gpt.com/api/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "inference_net_and_nano_gpt"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"deepseek/deepseek-v3-2" = "deepseek/deepseek-v3.2"
"moonshotai/kimi-k2-5" = "moonshotai/kimi-k2.5"
"zai-org/glm-5" = "zai-org/glm-5"
"minimax/minimax-m2-5" = "minimax/minimax-m2.5"
