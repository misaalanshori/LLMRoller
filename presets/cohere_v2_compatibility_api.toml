# Cohere v2 OpenAI Compatibility API (`api.cohere.com/compatibility/v1`) provider preset (F130).
# Spec: apiclientreferences/opencode/cohere.md

kind = "custom"
preset_id = "cohere_v2_compatibility_api"
name = "Cohere v2 OpenAI Compatibility API (`api.cohere.com/compatibility/v1`)"
base_url = "https://api.cohere.com/compatibility/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"command-a-03-2025" = "command-a-03-2025"
"command-a-reasoning-08-2025" = "command-a-reasoning-08-2025"
"command-a-vision-07-2025" = "command-a-vision-07-2025"
"command-r-plus-08-2024" = "command-r-plus-08-2024"
