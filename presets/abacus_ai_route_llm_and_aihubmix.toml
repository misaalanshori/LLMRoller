# Abacus.AI RouteLLM (`routellm.abacus.ai/v1`) & AIHubMix (`aihubmix.com/v1`) provider preset (F151).
# Spec: apiclientreferences/opencode/abacus.md, apiclientreferences/opencode/aihubmix.md

kind = "custom"
preset_id = "abacus_ai_route_llm_and_aihubmix"
name = "Abacus.AI RouteLLM (`routellm.abacus.ai/v1`) & AIHubMix (`aihubmix.com/v1`)"
base_url = "https://routellm.abacus.ai/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "abacus_ai_route_llm_and_aihubmix"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"route-llm" = "route-llm"
"claude-opus-4-6" = "claude-opus-4-6"
"gpt-5-4" = "gpt-5.4"
"gemini-3-1-pro-preview" = "gemini-3.1-pro-preview"
