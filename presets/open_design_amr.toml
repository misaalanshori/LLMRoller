# Open Design AMR provider preset.
# Spec: ./docs/srdd/2. SRDD - Research Findings.md#23-target-provider-endpoints-protocols-and-quotas

kind = "open_design_amr"
name = "Open Design AMR"
base_url = "https://amr-link.open-design.ai/v1"
ua_policy = "pass"

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"
usage = "/usage"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"anthropic-version" = "2023-06-01"

[session_profile]
headers = ["x-session-affinity", "x-session-id"]
body_field = "prompt_cache_key"

[aliases]
"claude-opus-4-6" = "claude-opus-4.6"
"claude-sonnet-4-5-20250929" = "claude-sonnet-4.5"
"claude-haiku-4-5-20251001" = "claude-haiku-4.5"
