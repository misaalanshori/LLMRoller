# Hugging Face Inference Router (`router.huggingface.co/v1`) provider preset (F125).
# Spec: apiclientreferences/pi/huggingface.md, apiclientreferences/opencode/huggingface.md

kind = "custom"
preset_id = "huggingface_inference_router"
name = "Hugging Face Inference Router (`router.huggingface.co/v1`)"
base_url = "https://router.huggingface.co/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"deepseek-ai/deepseek-r1" = "deepseek-ai/DeepSeek-R1"
"deepseek-ai/deepseek-v3-2" = "deepseek-ai/DeepSeek-V3.2"
"qwen/qwen3-coder-480b-a35b-instruct" = "Qwen/Qwen3-Coder-480B-A35B-Instruct"
"moonshotai/kimi-k2-5" = "moonshotai/Kimi-K2.5"
"zai-org/glm-5" = "zai-org/GLM-5"
