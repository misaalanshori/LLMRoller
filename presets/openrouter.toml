# OpenRouter provider preset.
# Spec: ./docs/srdd/2. SRDD - Research Findings.md#23-target-provider-endpoints-protocols-and-quotas

kind = "openrouter"
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
ua_policy = "pass"

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"
usage = "/key"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "native"

[aliases]
"claude-sonnet-4-6" = "claude-sonnet-4.6"
