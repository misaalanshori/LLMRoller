# iFlow (`apis.iflow.cn/v1`) & Meituan LongCat (`api.longcat.chat/openai/v1`) provider preset (F162).
# Spec: apiclientreferences/9router/iflow.md, apiclientreferences/9router/longcat.md

kind = "custom"
preset_id = "iflow_cn_and_longcat_meituan"
name = "iFlow (`apis.iflow.cn/v1`) & Meituan LongCat (`api.longcat.chat/openai/v1`)"
base_url = "https://apis.iflow.cn/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "iflow_cn_and_longcat_meituan"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"longcat-flash-chat" = "LongCat-Flash-Chat"
"longcat-flash-thinking" = "LongCat-Flash-Thinking"
"deepseek-v3-2" = "DeepSeek-V3.2"
"qwen3-coder" = "Qwen3-Coder"
