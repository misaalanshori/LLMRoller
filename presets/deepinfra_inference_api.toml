# DeepInfra (`api.deepinfra.com/v1/openai`) provider preset (F128).
# Spec: apiclientreferences/opencode/deepinfra.md, apiclientreferences/9router/deepinfra.md

kind = "custom"
preset_id = "deepinfra_inference_api"
name = "DeepInfra (`api.deepinfra.com/v1/openai`)"
base_url = "https://api.deepinfra.com/v1/openai"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"moonshotai/kimi-k2-5" = "moonshotai/Kimi-K2.5"
"zai-org/glm-5" = "zai-org/GLM-5"
"minimaxai/minimax-m2-5" = "MiniMaxAI/MiniMax-M2.5"
"qwen/qwen3-coder-480b-a35b-instruct" = "Qwen/Qwen3-Coder-480B-A35B-Instruct"
