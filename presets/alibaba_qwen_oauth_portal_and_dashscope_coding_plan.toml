# Alibaba Qwen Code OAuth (`portal.qwen.ai`) & DashScope Coding Plan (`coding.dashscope.aliyuncs.com` / `dashscope-intl.aliyuncs.com`) provider preset (F113).
# Spec: apiclientreferences/9router/qwen.md, apiclientreferences/opencode/alibaba.md

kind = "custom"
preset_id = "alibaba_qwen_oauth_portal_and_dashscope_coding_plan"
name = "Alibaba Qwen Code OAuth (`portal.qwen.ai`) & DashScope Coding Plan (`coding.dashscope.aliyuncs.com` / `dashscope-intl.aliyuncs.com`)"
base_url = "https://portal.qwen.ai/v1/chat/completions"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"user-agent" = "qwen-code/0.1.0 ({{os}}/{{arch}})"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"qwen3-coder-plus" = "qwen3-coder-plus"
"qwen3-coder-flash" = "qwen3-coder-flash"
"qwen3-coder-next" = "qwen3-coder-next"
"qwen3-5-plus" = "qwen3.5-plus"
"qwen3-6-plus" = "qwen3.6-plus"
"qwq-32b" = "qwq-32b"
