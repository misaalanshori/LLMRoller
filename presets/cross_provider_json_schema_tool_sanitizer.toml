# Universal Tool Call JSON Schema Sanitizer (Google/Antigravity Subset vs OpenAI Strict Mode vs Anthropic Input Schema) provider preset (F176).
# Spec: apiclientreferences/pi-antigravity/antigravity.md, apiclientreferences/9router/antigravity.md, apiclientreferences/pi/google.md

kind = "custom"
preset_id = "cross_provider_json_schema_tool_sanitizer"
name = "Universal Tool Call JSON Schema Sanitizer (Google/Antigravity Subset vs OpenAI Strict Mode vs Anthropic Input Schema)"
base_url = "https://api.openai.com/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "cross_provider_json_schema_tool_sanitizer"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"anthropic" = "Anthropic"
"gemini" = "Gemini"
"antigravity" = "Antigravity"
"mistral" = "Mistral"
