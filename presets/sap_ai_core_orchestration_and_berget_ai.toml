# SAP AI Core (`aicore.deploy.instruct` with OAuth2 Client Credentials & `AI-Resource-Group`) & Berget AI (`api.berget.ai/v1`) provider preset (F147).
# Spec: apiclientreferences/opencode/sap-ai-core.md, apiclientreferences/opencode/berget.md

kind = "custom"
preset_id = "sap_ai_core_orchestration_and_berget_ai"
name = "SAP AI Core (`aicore.deploy.instruct` with OAuth2 Client Credentials & `AI-Resource-Group`) & Berget AI (`api.berget.ai/v1`)"
base_url = "https://api.ai.prod.{region}.aws.ml.hana.ondemand.com/v2/inference/deployments/{id}"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"anthropic--claude-4-6-opus" = "anthropic--claude-4.6-opus"
"anthropic--claude-4-5-sonnet" = "anthropic--claude-4.5-sonnet"
"gpt-5" = "gpt-5"
"gemini-2-5-pro" = "gemini-2.5-pro"
