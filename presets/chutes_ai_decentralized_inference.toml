# Chutes AI (`llm.chutes.ai/v1`) provider preset (F137).
# Spec: apiclientreferences/opencode/chutes.md

kind = "custom"
preset_id = "chutes_ai_decentralized_inference"
name = "Chutes AI (`llm.chutes.ai/v1`)"
base_url = "https://llm.chutes.ai/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "chutes_ai_decentralized_inference"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"deepseek-ai/deepseek-r1-0528" = "deepseek-ai/DeepSeek-R1-0528"
"deepseek-ai/deepseek-v3-0324" = "deepseek-ai/DeepSeek-V3-0324"
"qwen/qwen3-coder-480b-a35b-instruct-fp8" = "Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8"
"zai-org/glm-5-tee" = "zai-org/GLM-5-TEE"
"moonshotai/kimi-k2-5-tee" = "moonshotai/Kimi-K2.5-TEE"
