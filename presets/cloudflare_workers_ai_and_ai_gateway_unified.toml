# Cloudflare Workers AI (`/client/v4/accounts/{id}/ai/v1`) & Cloudflare AI Gateway (`gateway.ai.cloudflare.com/v1/{account}/{gateway}`) provider preset (F119).
# Spec: apiclientreferences/opencode/cloudflare.md, apiclientreferences/pi/cloudflare-ai-gateway.md

kind = "custom"
preset_id = "cloudflare_workers_ai_and_ai_gateway_unified"
name = "Cloudflare Workers AI (`/client/v4/accounts/{id}/ai/v1`) & Cloudflare AI Gateway (`gateway.ai.cloudflare.com/v1/{account}/{gateway}`)"
base_url = "https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/compat/chat/completions"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "cloudflare_workers_ai_and_ai_gateway_unified"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"@cf/meta/llama-3-3-70b-instruct-fp8-fast" = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
"@cf/deepseek-ai/deepseek-r1-distill-qwen-32b" = "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b"
"openai/gpt-5-4" = "openai/gpt-5.4"
"anthropic/claude-sonnet-4-6" = "anthropic/claude-sonnet-4-6"
