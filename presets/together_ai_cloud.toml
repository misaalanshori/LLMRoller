# Together AI (`api.together.xyz/v1`) provider preset (F126).
# Spec: apiclientreferences/opencode/togetherai.md, apiclientreferences/9router/together.md

kind = "custom"
preset_id = "together_ai_cloud"
name = "Together AI (`api.together.xyz/v1`)"
base_url = "https://api.together.xyz/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"deepseek-ai/deepseek-r1" = "deepseek-ai/DeepSeek-R1"
"deepseek-ai/deepseek-v3-1" = "deepseek-ai/DeepSeek-V3.1"
"moonshotai/kimi-k2-5" = "moonshotai/Kimi-K2.5"
"qwen/qwen3-coder-480b-a35b-instruct-fp8" = "Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8"
"zai-org/glm-5" = "zai-org/GLM-5"
