# Perplexity Sonar API (`api.perplexity.ai`) provider preset (F129).
# Spec: apiclientreferences/opencode/perplexity.md, apiclientreferences/9router/perplexity.md

kind = "custom"
preset_id = "perplexity_sonar_api"
name = "Perplexity Sonar API (`api.perplexity.ai`)"
base_url = "https://api.perplexity.ai"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"sonar-deep-research" = "sonar-deep-research"
"sonar-reasoning-pro" = "sonar-reasoning-pro"
"sonar-pro" = "sonar-pro"
"sonar" = "sonar"
