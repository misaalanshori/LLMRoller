# SambaNova Cloud (`api.sambanova.ai/v1`) provider preset (F132).
# Spec: apiclientreferences/9router/sambanova.md

kind = "custom"
preset_id = "sambanova_cloud_api"
name = "SambaNova Cloud (`api.sambanova.ai/v1`)"
base_url = "https://api.sambanova.ai/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "sambanova_cloud_api"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"deepseek-r1" = "DeepSeek-R1"
"deepseek-v3-0324" = "DeepSeek-V3-0324"
"qwen3-32b" = "Qwen3-32B"
"meta-llama-3-3-70b-instruct" = "Meta-Llama-3.3-70B-Instruct"
