# Submodel (`llm.submodel.ai/v1`) & Moark / Gitee AI (`ai.gitee.com/v1`) provider preset (F168).
# Spec: apiclientreferences/opencode/submodel.md, apiclientreferences/opencode/moark.md

kind = "custom"
preset_id = "submodel_instagen_and_moark_gitee"
name = "Submodel (`llm.submodel.ai/v1`) & Moark / Gitee AI (`ai.gitee.com/v1`)"
base_url = "https://llm.submodel.ai/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "submodel_instagen_and_moark_gitee"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"deepseek-ai/deepseek-r1-0528" = "deepseek-ai/DeepSeek-R1-0528"
"deepseek-ai/deepseek-v3-1" = "deepseek-ai/DeepSeek-V3.1"
"qwen/qwen3-235b-a22b-instruct-2507" = "Qwen/Qwen3-235B-A22B-Instruct-2507"
"glm-4-7" = "GLM-4.7"
