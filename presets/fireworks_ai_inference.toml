# Fireworks AI (`api.fireworks.ai/inference/v1`) provider preset (F127).
# Spec: apiclientreferences/opencode/fireworks-ai.md, apiclientreferences/9router/fireworks.md

kind = "custom"
preset_id = "fireworks_ai_inference"
name = "Fireworks AI (`api.fireworks.ai/inference/v1`)"
base_url = "https://api.fireworks.ai/inference/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"accounts/fireworks/models/deepseek-v3p2" = "accounts/fireworks/models/deepseek-v3p2"
"accounts/fireworks/models/kimi-k2p5" = "accounts/fireworks/models/kimi-k2p5"
"accounts/fireworks/models/glm-5" = "accounts/fireworks/models/glm-5"
"accounts/fireworks/models/minimax-m2p5" = "accounts/fireworks/models/minimax-m2p5"
