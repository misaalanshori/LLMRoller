# Pollinations AI (`text.pollinations.ai/openai`) & Puter AI (`api.puter.com`) provider preset (F164).
# Spec: apiclientreferences/9router/pollinations.md, apiclientreferences/9router/puter.md

kind = "custom"
preset_id = "pollinations_ai_and_puters_free_gateways"
name = "Pollinations AI (`text.pollinations.ai/openai`) & Puter AI (`api.puter.com`)"
base_url = "https://text.pollinations.ai/openai"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "pollinations_ai_and_puters_free_gateways"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"openai" = "openai"
"openai-large" = "openai-large"
"claude-hybridspace" = "claude-hybridspace"
"deepseek-reasoning" = "deepseek-reasoning"
