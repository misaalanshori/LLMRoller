# Hyperbolic (`api.hyperbolic.xyz/v1`) provider preset (F135).
# Spec: apiclientreferences/9router/hyperbolic.md

kind = "custom"
preset_id = "hyperbolic_ai_inference"
name = "Hyperbolic (`api.hyperbolic.xyz/v1`)"
base_url = "https://api.hyperbolic.xyz/v1"
ua_policy = "pass"
supported_protocols = ["chat", "responses", "messages"]

[paths]
chat = "/chat/completions"
responses = "/responses"
messages = "/messages"
models = "/models"

[aux_endpoints]
count_tokens = false
responses_compact = false

[usage_reporting]
chat_stream = "inject"

[add_headers]
"x-llmroller-preset" = "hyperbolic_ai_inference"

[session_profile]
headers = ["x-session-id", "x-session-affinity"]

[aliases]
"deepseek-ai/deepseek-r1" = "deepseek-ai/DeepSeek-R1"
"deepseek-ai/deepseek-v3-0324" = "deepseek-ai/DeepSeek-V3-0324"
"qwen/qwen2-5-coder-32b-instruct" = "Qwen/Qwen2.5-Coder-32B-Instruct"
"openai/gpt-oss-120b" = "openai/gpt-oss-120b"
