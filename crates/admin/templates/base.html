<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{{ title }} - LLMRoller</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/uPlot.min.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/app.js"></script>
    <script src="/static/uPlot.iife.min.js"></script>
</head>
<body hx-headers='{"x-csrf-token": "{{ csrf_token }}"}'>
    {% if traceability_enabled %}
    <div id="traceability-banner" class="traceability-banner">
        Content Traceability Mode is active. Turn content is being retained.
    </div>
    {% endif %}

    <header class="app-header">
        <div class="header-left">
            <a href="/" class="brand-link">
                <span class="brand-icon">⚡</span>
                <span class="brand-name">LLMRoller</span>
            </a>
            <nav class="nav-links">
                <a href="/app" class="nav-link {% if !is_admin %}active{% endif %}">Personal Workspace</a>
                {% if is_admin %}
                <a href="/admin" class="nav-link {% if is_admin %}active{% endif %}">Admin Console</a>
                {% endif %}
            </nav>
        </div>
        <div class="header-right">
            <span class="status-indicator" title="Service Ready">
                <span class="status-dot"></span> Ready
            </span>
            <form method="POST" action="/api/auth/logout" class="logout-form">
                <button type="submit" class="btn btn-sm btn-ghost">Sign Out</button>
            </form>
        </div>
    </header>

    <main class="main-container">
        {{ content|safe }}
    </main>
</body>
</html>
