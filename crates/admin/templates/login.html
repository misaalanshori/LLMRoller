<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>LLMRoller - Sign In</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app-core.js" defer></script>
    <script src="/static/app-providers.js" defer></script>
    <script src="/static/app-keys.js" defer></script>
    <script src="/static/app-catalog.js" defer></script>
    <script src="/static/app-settings.js" defer></script>
    <script src="/static/app-charts.js" defer></script>
    <script src="/static/app-prices.js" defer></script>
    <script src="/static/app-sessions.js" defer></script>
    <script src="/static/app-accounts.js" defer></script>
    <script src="/static/app-shares.js" defer></script>
    <script src="/static/app-users.js" defer></script>
    <script src="/static/app-auth.js" defer></script>
</head>
<body class="auth-page">
    <div class="card auth-card">
        <h1>LLMRoller</h1>
        <p class="subtitle">Sign in to your control workspace</p>
        <div id="error-box" class="alert"></div>
        <form id="login-form" method="POST" action="/api/auth/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required autofocus placeholder="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required placeholder="••••••••••••">
            </div>
            <div class="form-group">
                <label for="totp_code">2FA Code (Optional)</label>
                <input id="totp_code" name="totp_code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code">
            </div>
            <button type="submit" id="submit-btn">Sign In</button>
        </form>
    </div>
</body>
</html>
